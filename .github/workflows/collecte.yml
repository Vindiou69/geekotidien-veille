name: Collecte veille Geekotidien

on:
  workflow_dispatch:        # lancement manuel : bouton « Run workflow » (GitHub, téléphone compris)
  push:
    branches: [main]
    paths: ['.lancer-collecte']   # lancement depuis la page Geekotidien : écriture de ce fichier

permissions:
  contents: write

jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install feedparser
      - run: python veille/veille.py
      - name: Enregistrer veille.csv sur main
        run: |
          git config user.name "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          git add veille.csv
          if git diff --cached --quiet; then
            echo "veille.csv inchangé : rien à enregistrer"
          else
            git commit -m "Veille du $(date -u +%Y-%m-%d)"
            git push origin HEAD:main
          fi
