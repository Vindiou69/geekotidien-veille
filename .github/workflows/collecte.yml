name: Collecte veille Geekotidien

on:
  workflow_dispatch:        # lancement manuel uniquement : bouton « Run workflow » (GitHub, téléphone compris)

permissions:
  contents: write

jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install feedparser
      - run: python veille/veille.py
      - name: Enregistrer veille.csv sur main
        run: |
          git config user.name "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          git add veille.csv
          git commit -m "Veille du $(date -u +%Y-%m-%d)" || echo "Rien à enregistrer"
          git pull --rebase origin main
          git push origin HEAD:main
