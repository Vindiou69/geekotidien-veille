name: Collecte veille Geekotidien

on:
  schedule:
    - cron: "0 18 * * *"   # 18h UTC = 19h à Paris en hiver, 20h en été
  workflow_dispatch:        # bouton « Run workflow » pour lancer la collecte à la main

permissions:
  contents: write

jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install feedparser
      - run: python veille/veille.py
      - name: Enregistrer veille.csv dans le dépôt
        run: |
          git config user.name "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          git add veille.csv
          git commit -m "Veille du $(date -u +%Y-%m-%d)" || echo "Rien à enregistrer"
          git push
